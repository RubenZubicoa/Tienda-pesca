<div class="page">
  <app-spinner></app-spinner>

  <div
    class="mobile-sidenav"
    [attr.data-open]="isSidenavOpen"
    aria-hidden="true"
  >
    <button
      class="mobile-sidenav__backdrop"
      type="button"
      (click)="closeSidenav()"
      aria-label="Cerrar menú"
      tabindex="-1"
    ></button>
    <aside class="mobile-sidenav__panel" aria-label="Menú de categorías">
      <app-sidenav (navigate)="closeSidenav()"></app-sidenav>
    </aside>
  </div>

  <div class="app-shell">
    <aside class="app-shell__sidenav" aria-label="Barra lateral">
      <app-sidenav></app-sidenav>
    </aside>

    <div class="app-shell__body">
      <app-header (menuToggle)="toggleSidenav()"></app-header>

      <div class="app-shell__main">
        <main class="content">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  </div>

    class="whatsapp-fab"
    href="https://wa.me/34669234618?text=Hola%2C%20tengo%20una%20consulta%20sobre%20The%20Lake"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contactar por WhatsApp"
    title="Contactar por WhatsApp"
  >
    <span class="whatsapp-fab__label">¡Podemos ayudarte!</span>
    <svg class="whatsapp-fab__icon" viewBox="0 0 24 24" aria-hidden="true">

        fill="currentColor"
