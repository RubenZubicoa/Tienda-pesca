<nav class="sidenav" aria-label="Menú lateral">
  <a class="sidenav__brand" routerLink="/" aria-label="Inicio" (click)="navigate.emit()">
    <img class="sidenav__logo" src="logo-the-lake.jpeg" alt="The Lake" />
  </a>

  <div class="sidenav__group" aria-label="Secciones">
    <ul class="sidenav__list" aria-label="Opciones">
      @for (item of items(); track item.uuid) {
        <li class="sidenav__item">
          @if (item.children?.length) {
            <div class="sidenav__parent">
              <a class="sidenav__link sidenav__link--parent" (click)="openParent(item)">
                <span class="sidenav__linkText">{{ item.label }}</span>
              </a>
              <button
                class="sidenav__toggle"
                type="button"
                (click)="toggle(item.label)"
                [attr.aria-expanded]="isExpanded(item.label)"
                [attr.aria-controls]="groupId(item.label)"
                [attr.aria-label]="'Mostrar u ocultar subcategorías de ' + item.label"
              >
                <span class="sidenav__chevron" aria-hidden="true"></span>
              </button>
            </div>
          } @else {
            <a class="sidenav__link" (click)="navigateToCategory(item)">{{ item.label }}</a>
          }

          @if (item.children?.length) {
            <ul
              class="sidenav__sublist"
              aria-label="Subopciones"
              [id]="groupId(item.label)"
              [attr.data-collapsed]="!isExpanded(item.label)"
            >
              @for (child of item.children; track child.uuid) {
                <li class="sidenav__subitem">
                  <a class="sidenav__sublink" (click)="navigateToSubCategory(item, child)">{{ child.label }}</a>
                </li>
              }
            </ul>
          }
        </li>
      }
    </ul>
  </div>
</nav>
